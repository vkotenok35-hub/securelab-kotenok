<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЛР 3 — сценарій сеансу</title>
</head>
<body>
  <h1>Сценарій: register, login, профіль, створення, logout</h1>
  <p id="state">Стан: перевіряється…</p>

  <section>
    <h2>Реєстрація</h2>
    <form id="register-form">
      <label>Ім’я користувача <input name="userName" required autocomplete="username"></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Ім’я профілю <input name="displayName" required></label>
      <label>Пароль <input name="password" type="password" required autocomplete="new-password"></label>
      <button>Зареєструватися</button>
    </form>
    <p id="register-result"></p>
  </section>

  <section>
    <h2>Вхід</h2>
    <form id="login-form">
      <label>Ім’я користувача <input name="userName" required autocomplete="username"></label>
      <label>Пароль <input name="password" type="password" required autocomplete="current-password"></label>
      <button>Увійти</button>
    </form>
    <p id="login-result"></p>
  </section>

  <section>
    <h2>Профіль</h2>
    <button id="profile-button" type="button">Показати профіль</button>
    <ul id="profile"></ul>
    <p id="profile-result"></p>
  </section>

  <section>
    <h2>Новий інцидент</h2>
    <form id="incident-form">
      <label>Заголовок <input name="title" required></label>
      <label>Опис <input name="description" required></label>
      <label>Важливість
        <select name="severity">
          <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
        </select>
      </label>
      <label>Час події <input name="occurredAt" type="datetime-local" required></label>
      <button>Створити</button>
    </form>
    <p id="incident-result"></p>
  </section>

  <section>
    <button id="logout-button" type="button">Вийти</button>
    <p id="logout-result"></p>
  </section>

  <script src="flow.js" defer></script>
</body>
</html>
